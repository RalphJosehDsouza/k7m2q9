services:
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
